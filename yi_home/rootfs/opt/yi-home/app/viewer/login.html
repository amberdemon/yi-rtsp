<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YI View — Sign in</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head><body><main class="login-main"><section class="login-card"><p class="eyebrow">PRIVATE HOME VIEWING</p><h1>YI View</h1><p class="sub">Sign in to your cameras.</p><form id="login-form"><label for="password">Viewer password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256"><button type="submit">Sign in</button><p id="login-error" role="alert" hidden></p></form><p class="login-note">Use your separate viewer password. Your YI account password is never needed here.</p></section></main></body></html>
